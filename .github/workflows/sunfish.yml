name: Google Pixel 4a (sunfish) - SM7150

# CI for the sunfish port. The firmware only boots on a real Pixel 4a, so CI
# checks what can be checked automatically:
#
#   build       - the sunfish image compiles and gets packaged into an
#                 ABL-compatible (header_version 0) boot image;
#   dsdt-source - the DSDT source still compiles to the shipped table.
#
# Pushing a v* tag additionally publishes boot-sunfish.img as a GitHub
# release (a pre-release when the tag contains alpha/beta/rc).
#
# No wine: this port does not compile ACPI sources during the image build
# (the DSDT.aml is prebuilt and checked in), so the heavy wine/ms asl
# toolchain that other edk2-msm CIs install is deliberately skipped here.

on:
  push:
    branches: [sunfish-sm7150]
    tags: ['v*']
  pull_request:

concurrency:
  group: sunfish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Image Build (sunfish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential uuid-dev clang llvm iasl nasm \
            gcc-aarch64-linux-gnu python3-pil python3-git gettext

      - name: Build an image for sunfish
        run: ./build.sh --device sunfish

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunfish
          path: |
            boot-sunfish.img
            workspace/uefi-sunfish-kernel
            workspace/uefi-sunfish.img.gz

  dsdt-source:
    name: DSDT Source Builds with iasl (sunfish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install iasl
        run: |
          sudo apt-get update
          sudo apt-get -y install acpica-tools

      - name: Compile Platform/Google/sm7150/AcpiTables/sunfish/Dsdt.asl
        run: |
          mkdir -p /tmp/dsdt-check
          cp Platform/Google/sm7150/AcpiTables/sunfish/Dsdt.asl /tmp/dsdt-check/
          ( cd /tmp/dsdt-check && iasl -ve Dsdt.asl )
          # 439135 = shipped 439132-byte table + the _HID alias->method wrapper
          # required by iasl >= 2023 (see the commit that added this source).
          test "$(stat -c %s /tmp/dsdt-check/Dsdt.aml)" = 439135

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dsdt-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: sunfish
          path: out

      - name: Checksums
        run: |
          cp out/boot-sunfish.img "boot-sunfish-${GITHUB_REF_NAME}.img"
          sha256sum "boot-sunfish-${GITHUB_REF_NAME}.img" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: sunfish UEFI ${{ github.ref_name }}
          body_path: Platform/Google/sm7150/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            boot-sunfish-${{ github.ref_name }}.img
            SHA256SUMS
