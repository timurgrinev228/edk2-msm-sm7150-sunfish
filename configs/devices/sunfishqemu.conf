# Google Pixel 4a (sunfish) - QEMU test profile
# Identical to sunfish.conf, but the platform DSC redirects the GIC / arch timer
# PCDs to the addresses used by qemu-system-aarch64 -M virt, because the SM7150
# interrupt controller obviously does not exist inside QEMU.
SOC_PLATFORM="SM7150"
VENDOR_NAME="Google"
PLATFORM_NAME="sunfishqemu"

SPLIT_DSDT=true
USE_IASL=true

BOOTIMG_OS_PATCH_LEVEL="2023-08"
BOOTIMG_OS_VERSION=13.0.0
BOOTIMG_HEADER_VERSION=0
