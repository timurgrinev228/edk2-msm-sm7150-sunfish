# Google Pixel 4a (sunfish) - Snapdragon 730G / SM7150
#
# NOTE: the Pixel's ABL only boots an Android boot image with
# header_version 0 (see Platform/Google/sm7150/platform.sh.inc).
SOC_PLATFORM="SM7150"
VENDOR_NAME="Google"
PLATFORM_NAME="sunfish"

# ACPI: AcpiTables/sunfish/Dsdt.asl is a real source now (disassembled reference
# table with the Pixel 4a touchscreen wiring), so let build.sh -A / --acpi
# rebuild DSDT.aml instead of refusing.
SPLIT_DSDT=true
USE_IASL=true

BOOTIMG_OS_PATCH_LEVEL="2023-08"
BOOTIMG_OS_VERSION=13.0.0
BOOTIMG_HEADER_VERSION=0
